services:
  postgres:
    image: postgres:17
    container_name: scoundrels-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoundrel_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: scoundrels-backend
    ports:
      - "3000:3000"
    environment:
      PGURI: ${PGURI}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: scoundrels-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
