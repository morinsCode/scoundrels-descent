services:
  postgres:
    image: postgres:17
    container_name: scoundrels-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: scoundrels-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGURI: ${PGURI}

    expose:
      - "3000"

  frontend:
    build: ./frontend
    container_name: scoundrels-frontend
    restart: unless-stopped

    depends_on:
      - backend

    expose:
      - "80"

    networks:
      - default
      - web

volumes:
  postgres-data:

networks:
  web:
    external: true
    name: morinscode-web
